name: rezef

networks:
  # ה-DB על רשת פנימית בלבד: אין לו נתיב אל האינטרנט ומהאינטרנט.
  internal:
    internal: true
  # אותה רשת חיצונית שבה Caddy של listmonk מדבר עם האפליקציות (כמו kahane).
  web:
    external: true
    name: listmonk_web

volumes:
  rezef-db:

services:
  db:
    image: postgres:17-alpine
    container_name: rezef-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: rezef
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_DB: rezef
    volumes:
      - rezef-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rezef -d rezef"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - internal
    # בלי ports, בכוונה.

  app:
    build: .
    container_name: rezef-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://rezef:${POSTGRES_PASSWORD:?}@db:5432/rezef
      AUTO_MIGRATE: "1"
      REZEF_BRIDGE_SECRET: ${REZEF_BRIDGE_SECRET:?}
      SESSION_SECRET: ${SESSION_SECRET:?}
      WP_URL: ${WP_URL:?}
      APP_URL: ${APP_URL:?}
      PILOT_WP_USER_IDS: ${PILOT_WP_USER_IDS:-}
      INTERNAL_KEY: ${INTERNAL_KEY:?}
    networks:
      - internal
      - web
    # בלי ports: רק Caddy מדבר איתה, ככתובת rezef-app:3000.
