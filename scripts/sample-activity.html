<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>חידון שברים לדוגמה</title>
<script>
/* rezef-report v1 */
window.rezef = (function () {
  function send(type, data) {
    try { window.parent.postMessage({ rezef: 1, type: type, data: data || {} }, "*"); } catch (e) {}
  }
  return {
    start: function (d) { send("start", d); },
    answer: function (d) { send("answer", d); },
    progress: function (percent) { send("progress", { percent: percent }); },
    finish: function (d) { send("finish", d); }
  };
})();
</script>
<style>
  body { font-family: system-ui, sans-serif; background: #f5f6f9; margin: 0; padding: 24px; color: #1b1d22; }
  main { max-width: 560px; margin: 0 auto; background: #fff; border-radius: 24px; padding: 24px; box-shadow: 0 6px 24px rgba(0,0,0,.08); }
  h1 { margin: 0 0 12px; font-size: 1.4rem; }
  button { border: 0; border-radius: 999px; padding: 10px 22px; font-size: 1rem; background: #6685f0; color: #fff; cursor: pointer; margin: 4px; }
  button.opt { background: #eef1fe; color: #1b1d22; }
  textarea { width: 100%; min-height: 80px; border-radius: 16px; border: 1px solid #e5e8ee; padding: 10px; font: inherit; box-sizing: border-box; }
  #msg { min-height: 1.5em; font-weight: 600; }
</style>
</head>
<body>
<main>
  <h1 id="q"></h1>
  <div id="opts"></div>
  <p id="msg"></p>
</main>
<script>
  var saved = localStorage.getItem("demo"); // בודק שהאחסון לא מפיל את הדף במסגרת מבודדת
  var questions = [
    { id: "q1", q: "כמה זה חצי ועוד רבע?", concept: "חיבור שברים", options: ["שלושה רבעים", "שני שלישים", "רבע"], answer: "שלושה רבעים" },
    { id: "q2", q: "איזה שבר גדול יותר: 2/3 או 3/5?", concept: "השוואת שברים", options: ["2/3", "3/5", "שווים"], answer: "2/3" },
    { id: "q3", q: "כמה זה 1/3 ועוד 1/6?", concept: "חיבור שברים", options: ["2/9", "1/2", "2/6"], answer: "1/2" },
    { id: "q4", q: "מהו הצמצום של 4/8?", concept: "צמצום שברים", options: ["1/2", "2/3", "1/4"], answer: "1/2" }
  ];
  var i = 0, score = 0;
  var q = document.getElementById("q"), opts = document.getElementById("opts"), msg = document.getElementById("msg");
  rezef.start({ title: "חידון שברים לדוגמה", total: questions.length + 1 });
  function show() {
    opts.innerHTML = ""; msg.textContent = "";
    if (i < questions.length) {
      var cur = questions[i];
      q.textContent = cur.q;
      cur.options.forEach(function (o) {
        var b = document.createElement("button"); b.className = "opt"; b.textContent = o;
        b.onclick = function () {
          var ok = o === cur.answer;
          rezef.answer({ id: cur.id, question: cur.q, concept: cur.concept, correct: ok, response: o, expected: cur.answer });
          if (ok) { score++; i++; rezef.progress(Math.round(i / (questions.length + 1) * 100)); show(); }
          else { msg.textContent = "לא בדיוק, נסו שוב"; }
        };
        opts.appendChild(b);
      });
    } else if (i === questions.length) {
      q.textContent = "הסבירו במילים שלכם: איך מחברים שברים עם מכנים שונים?";
      var t = document.createElement("textarea"); t.id = "open";
      var b = document.createElement("button"); b.textContent = "שליחה"; b.id = "send";
      b.onclick = function () {
        rezef.answer({ id: "open1", question: q.textContent, concept: "הסבר", type: "open", response: t.value });
        i++; show();
      };
      opts.appendChild(t); opts.appendChild(b);
    } else {
      q.textContent = "כל הכבוד, סיימתם!";
      msg.textContent = "ענית נכון על " + score + " מתוך " + questions.length;
      rezef.finish({ score: score, maxScore: questions.length, summary: "ענה נכון על " + score + " מתוך " + questions.length });
    }
  }
  show();
</script>
</body>
</html>
